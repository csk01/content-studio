[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "content-studio"
version = "0.0.1"
description = "Personalized Content Studio - creator-focused social publishing (Phase 0: CLI)"
requires-python = ">=3.12"
dependencies = [
  "typer>=0.12",
  "httpx>=0.27",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "keyring>=25",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
studio = "studio.cli.app:app"

[tool.hatch.build.targets.wheel]
packages = ["src/studio"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
strict = true
files = ["src/studio/core"]
